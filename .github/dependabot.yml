version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Europe/Paris"
      day: "monday"
      time: "08:00"
    groups:
      all-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Europe/Paris"
      day: "monday"
      time: "08:00"
    cooldown:
      default-days: 7